{{- /*
  The route carries the ExternalAuth filter exactly when it keys its backend
  for the IAM: global.iam.enabled is on and authz.service names a prefix. The
  session cookie is the sole authenticator this surface declares; accept
  picks the error shape, a login redirect for a browser and a json 401 for
  anything else. A cross-namespace decision API reference needs a
  ReferenceGrant in its namespace.
*/}}
{{- if .Values.gateway.enabled -}}
{{- $auth := include "mojaloop-common.httproute.externalAuth" (dict "context" . "authz" .Values.authz "allowedHeaders" (list "cookie" "accept")) | trim -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Chart.Name }}
  {{- include "mojaloop-common.authz.annotations" (dict "context" . "backend" (include "common.names.fullname" .) "authz" .Values.authz) | nindent 2 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "gateway.host is required when the gateway is enabled" .Values.gateway.host | quote }}
  rules:
    - {{- if or .Values.gateway.cors $auth }}
      filters:
        {{- with .Values.gateway.cors }}
        - type: CORS
          cors:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with $auth }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ template "common.names.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
