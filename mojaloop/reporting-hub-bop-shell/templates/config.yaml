apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}-config
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ template "common.names.name" . }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
data:
{{- range $fileName, $fileContents := .Values.configFiles }}
  {{ $fileName }}: |
  {{- if hasSuffix ".json" $fileName }}
  {{- include "common.tplvalues.renderToJson" ( dict "value" $fileContents "context" $ ) | nindent 4 }}
  {{- else }}
  {{- include "common.tplvalues.render" ( dict "value" $fileContents "context" $ ) | nindent 4 }}
  {{- end }}
{{- end }}
{{- if not (index .Values.configFiles "remotes.json") }}
{{- $remotes := list }}
{{- $scheme := .Values.portalScheme | default "https" }}
{{- range .Values.global.portalRemotes }}
{{- $remotes = append $remotes (dict
      "path" .path
      "label" .label
      "scope" .scope
      "url" (printf "%s://%s%s/app.js" $scheme .host (default "" .hostPath))
      "baseUrl" (printf "%s://%s%s" $scheme .host (default "" .hostPath))
      "menuComponent" (.menuComponent | default "Menu")
      "appComponent" (.appComponent | default "App")
      "permission" .permission
      "enabled" (ne .enabled false)
      "crossOrigin" (eq .crossOrigin true)) }}
{{- end }}
  remotes.json: |
    {{- toJson $remotes | nindent 4 }}
{{- end }}
