{{- /*
  When gateway.oathkeeper is enabled the route delegates auth to it via the
  ExternalAuth filter, forwarding the session cookie in and the identity
  headers out; disabled, the route plainly forwards. A cross-namespace
  oathkeeper reference needs a ReferenceGrant in the oathkeeper namespace.
*/}}
{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Chart.Name }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "gateway.host is required when the gateway is enabled" .Values.gateway.host | quote }}
  rules:
    - {{- if .Values.gateway.oathkeeper.enabled }}
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ .Values.gateway.oathkeeper.serviceName | quote }}
              {{- with .Values.gateway.oathkeeper.serviceNamespace }}
              namespace: {{ . | quote }}
              {{- end }}
              port: {{ .Values.gateway.oathkeeper.servicePort }}
            http:
              path: /decisions
              allowedHeaders:
                - cookie
                - accept
                - x-forwarded-proto
              allowedResponseHeaders:
                - x-user
                - x-email
                - x-roles
      {{- end }}
      backendRefs:
        - name: {{ template "common.names.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
